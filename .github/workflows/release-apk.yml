name: release-apk

# Egy lépésben: a `releases/kaliterm-debug-<sha>.apk.aa` + `.ab` chunkokat
# összerakja, és GitHub Release-t hoz létre a teljes APK-val mint asset.
#
# Trigger:
#   - manual: workflow_dispatch (GitHub UI / Actions tab "Run workflow"),
#     opcionálisan tag-szal és APK basename-szel
#   - automatikus: ha `release-*` tag-et pushlunk
#
# A GitHub Release-eknek nincs 100MB/fájl limitje (max 2GB/asset).

on:
  workflow_dispatch:
    inputs:
      apk_basename:
        description: 'APK basename (without .aa/.ab; pl. kaliterm-debug-72f326a.apk)'
        required: true
        default: 'kaliterm-debug-72f326a.apk'
      release_tag:
        description: 'Release tag (pl. v72f326a)'
        required: true
        default: 'v72f326a'
  push:
    tags:
      - 'release-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine APK basename + tag
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            APK="${{ inputs.apk_basename }}"
            TAG="${{ inputs.release_tag }}"
          else
            # release-72f326a → kaliterm-debug-72f326a.apk + v72f326a
            SHA="${GITHUB_REF_NAME#release-}"
            APK="kaliterm-debug-${SHA}.apk"
            TAG="v${SHA}"
          fi
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using APK=${APK} TAG=${TAG}"

      - name: Concatenate APK chunks
        run: |
          cd releases
          ls -lh "${{ steps.vars.outputs.apk }}".* || { echo "Nincsenek chunkok"; ls -lh; exit 1; }
          cat "${{ steps.vars.outputs.apk }}".?? > "${{ steps.vars.outputs.apk }}"
          ls -lh "${{ steps.vars.outputs.apk }}"
          sha256sum "${{ steps.vars.outputs.apk }}"

      - name: Create GitHub Release with full APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          body: |
            kaliterm debug APK build — automatikus release.

            **Telepítés (adb):**
            ```bash
            adb install ${{ steps.vars.outputs.apk }}
            ```

            **Vagy közvetlenül a telefonon:** Settings → Letöltött APK → Telepítés.

            Részletes build-info: lásd a `releases/README.md`-t a branch-ben.
          files: |
            releases/${{ steps.vars.outputs.apk }}
          fail_on_unmatched_files: true
