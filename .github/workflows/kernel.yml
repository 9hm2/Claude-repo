name: Kernel (UML) build

on:
  push:
    branches: [main]
    paths:
      - 'projects/kernel-build/**'
      - '.github/workflows/kernel.yml'
  pull_request:
    paths:
      - 'projects/kernel-build/**'
      - '.github/workflows/kernel.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/kernel-build

jobs:
  x86_64:
    name: UM build (x86_64 host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            xz-utils ca-certificates curl

      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: projects/kernel-build/build/*.tar.xz
          key: kernel-tarball-${{ hashFiles('projects/kernel-build/KERNEL_VERSION') }}

      - name: Build UML kernel (x86_64)
        run: make um-x86_64

      - name: Inspect output
        run: |
          file out/x86_64/linux-um
          ls -lh out/x86_64/linux-um

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-um-x86_64
          path: projects/kernel-build/out/x86_64/linux-um
          if-no-files-found: error

  # ARM64 host UML build job: szándékosan kihagyva.
  # Indok: a Linux mainline 6.12 LTS-ben nincs `arch/arm64/Makefile.um`,
  # tehát az ARM64 host UML upstream nem létezik. Ez az architektúra
  # alapköve, ezért külön döntést igényel — ld. projects/kernel-build/STATUS.md.
  # Várható feloldási opciók: LKL pivot, vagy out-of-tree ARM64 UM patch-sorozat.
