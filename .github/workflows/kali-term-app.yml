name: kali-term-app

on:
  # A push trigger minden branch-re fut, path filter szerint — így csak
  # akkor indul, ha a friss commit ténylegesen érintette ezt a projektet.
  # A pull_request trigger a teljes PR-diff-et nézi (merge-base óta), nem
  # az aktuális commit-ot, ami félrevezető rebuild-eket okozna; ezért nem
  # használjuk.
  push:
    paths:
      - 'projects/kali-term-app/**'
      - '.github/workflows/kali-term-app.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: projects/kali-term-app

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android NDK (27.0.12077973)
        run: |
          # A runneren van Android SDK; NDK-t a sdkmanager-rel telepítjük
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;27.0.12077973" "cmake;3.22.1" \
            > /dev/null
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Download lkl-android-arm64 artifact from kernel.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          JNILIB_DIR="app/src/main/jniLibs/arm64-v8a"
          ASSETS_DIR="app/src/main/assets/lkl/arm64-v8a"
          mkdir -p "$JNILIB_DIR" "$ASSETS_DIR"

          pull_run() {
            local branch="$1"
            echo "→ kerese kernel.yml legutóbbi sikeres run-ját a(z) $branch branch-en"
            local run_id
            run_id=$(gh run list --workflow=kernel.yml --branch="$branch" \
                       --status=success --limit 5 \
                       --json databaseId -q '.[0].databaseId' 2>/dev/null || echo "")
            if [[ -z "${run_id}" || "${run_id}" == "null" ]]; then
              echo "  nincs sikeres futás ezen a branch-en"
              return 1
            fi
            echo "  run id: ${run_id}"
            local tmp; tmp=$(mktemp -d)
            if ! gh run download "${run_id}" --name lkl-android-arm64 --dir "${tmp}" 2>/dev/null; then
              echo "  artifact 'lkl-android-arm64' nincs ezen a run-on"
              rm -rf "${tmp}"
              return 1
            fi
            echo "  artifact letöltve, tartalom:"
            ls -R "${tmp}"

            # .so és .a file-ok → jniLibs (Android auto-extract)
            #   FIGYELEM: csak a `lib*.so` mintát csomagolja az APK-be, az `.a`
            #   archive-okat csak referenciaként visszük (Gradle ignorálja, de
            #   debug-target build-hez kéznél lehet).
            local soc=0 toolc=0
            if [[ -d "${tmp}/lib" ]]; then
              for f in "${tmp}"/lib/*.so; do
                [[ -f "$f" ]] || continue
                cp -v "$f" "${JNILIB_DIR}/"
                soc=$((soc+1))
              done
            fi
            # Példa-tool binárisok (cptofs, cpfromfs, lklfuse, fs2tar) → assets
            # Phase 2c.4-ben az app runtime-ban filesDir-be extractálja + chmod +x
            if [[ -d "${tmp}/bin" ]]; then
              for f in "${tmp}"/bin/*; do
                [[ -f "$f" ]] || continue
                cp -v "$f" "${ASSETS_DIR}/"
                toolc=$((toolc+1))
              done
            fi
            rm -rf "${tmp}"
            echo "  → ${soc} db .so + ${toolc} db tool másolva"
            [[ "${soc}" -gt 0 ]]
          }

          if pull_run "${GITHUB_REF_NAME:-main}" || pull_run main; then
            echo "✓ LKL .so készen, jniLibs:"
            ls -lh "${JNILIB_DIR}"
            if [[ -d "${ASSETS_DIR}" ]] && compgen -G "${ASSETS_DIR}/*" >/dev/null; then
              echo "✓ LKL tools, assets:"
              ls -lh "${ASSETS_DIR}"
            fi
          else
            echo "⚠️  Nincs lkl-android-arm64 artifact — az APK LKL nélkül épül." >&2
            echo "    (kernel.yml ezen a branch-en és a main-en sem fut sikeresen.)" >&2
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kaliterm-debug-apk
          path: projects/kali-term-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
